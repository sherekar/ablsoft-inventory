spring:
  application:
    name: ablsoft-inventory
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 100
      hibernate.order_inserts: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
springdoc:
  paths-to-match: /api/inventory,/api/inventory/**
  override-with-generic-response: false
  default-produces-media-type: application/json
  swagger-ui:
    disable-swagger-default-url: true
inventory:
  timezone: ${APP_TIMEZONE:UTC}
  currency: ${APP_CURRENCY:USD}
  import:
    max-rows: 10000
    max-errors: 100
management:
  endpoints:
    web:
      exposure:
        include: health
server:
  port: 8080
  shutdown: graceful
